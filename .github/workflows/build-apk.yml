name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web bundle
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Initialize Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Install native Android media server plugin and permissions
        run: |
          JAVA_DIR="android/app/src/main/java/com/kilas/offlineshorts"
          mkdir -p "$JAVA_DIR"
          cp android-native/LocalMediaServer.java "$JAVA_DIR/LocalMediaServer.java"
          cp android-native/KilasMediaPlugin.java "$JAVA_DIR/KilasMediaPlugin.java"
          cp android-native/MainActivity.java "$JAVA_DIR/MainActivity.java"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          node -e '
            const fs = require("fs");
            const file = process.argv[1];
            let xml = fs.readFileSync(file, "utf8");
            if (!xml.includes("android:usesCleartextTraffic")) {
              xml = xml.replace(
                "<application",
                "<application\n        android:usesCleartextTraffic=\"true\""
              );
            }
            const perms = [
              "android.permission.READ_MEDIA_VIDEO",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_EXTERNAL_STORAGE"
            ];
            for (const p of perms) {
              if (!xml.includes(p)) {
                xml = xml.replace(
                  "<application",
                  `    <uses-permission android:name="${p}" />\n    <application`
                );
              }
            }
            fs.writeFileSync(file, xml);
          ' "$MANIFEST"

      - name: Build Debug APK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_DIR" > android/local.properties
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kilas-Shorts-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
